    <h2>정의</h2>
    <p>명지전문대학교는 대학으로 <br>서대문구에 있다.</p>

    <P>컴퓨터 보안공학과</P>

    <h1>4.특수 문자 표기</h1>
    <h2>공백이  있는  글자</h2>
    <h3>공백이       있는                      글자</h3>
    <h3>공백이&nbsp;&nbsp;&nbsp;있는&nbsp;&nbsp;&nbsp;글자</h3>

    <h2>특수 문자 표기</h2>
    <h3>ex. (숫자1) < (숫자2) 표시할 때.. </h3>
    <h3>5 < 9 </h3>
    <h3>5 &lt; 9 </h3>

    <h3>3 > 2 </h3>
    <h3>3 &gt; 2 </h3>

    <h3>ex. (숫자1) & (숫자2) 표시할 때.. </h3>
    <h3>(숫자1) &amp; (숫자2)</h3>
