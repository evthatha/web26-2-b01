<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
   
    <title>etc_action</title>
    <style>
    h1:hover{color: red;}
    h1:active{color: blue;}
/*input 태그가 사용 가능할 때 배경에 white 적용*/
    input:enabled{background-color: white;}
        /*input 태그가 사용 불가능할 때 배경에 gray 적용*/
    input:disabled{background-color: gray;}
        /*input 태그가 포커스를 맞출 때 배경에 red적용*/
    input:focus{background-color: red;}
    </style>

</head>
<body>
    <h2>반응 선택자</h2>
    <h2>상태 선택자</h2>
    <hr>

    <h1>반응 선택자</h1>
    <hr>

    <h2>사용 가능</h2>
    <input>
    <h2>사용 불가능</h2>
    <input disabled="disabled">
    
</body>
</html>
