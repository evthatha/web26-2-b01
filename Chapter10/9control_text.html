<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        window.onload = function() {
            let output = '';
            for(let i = 0; i < 10; i++) {
                output += '<h1>Header - ' + i + '</h1>';
            }

           
            document.body.textContent = output;
            
           
        };
    </script>
</head>

<body>
    <hr>
    <h2>03 문서 객체 조작</h2>
    <ol>
        <li><b>글자 조작</b></li>
        <li>스타일 조작</li>
        <li>속성 조작</li>
    </ol>

    <p>
        1. <b>textContent</b> 속성을 사용해 문서 객체 내부의 글자를 변경하면, HTML 태그를 해석하지 않고 입력한 글자(태그 포함)가 그대로 body 태그 내부에 들어갑니다.<br>
        2. <b>innerHTML</b> 속성을 사용하면 textContent 속성과 달리 HTML 태그를 실제 태그로 적용하여 내부 내용을 변경합니다.
    </p>
</body>

</html>
