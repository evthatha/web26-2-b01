<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            padding: 20px;
        }
        #target {
            width: 150px;
            height: 50px;
            border: 1px solid black;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <hr>
    <h4>3.2 스타일 조작</h4>
    <ol>
        <li>속성 값을 입력해 속성 지정하기 <button id="btn1">실행</button></li>
        <li>객체를 입력해 속성 지정하기 <button id="btn2">실행</button></li>
        <li><b>함수를 이용해 속성 지정하기</b> <button id="btn3">실행</button></li>
    </ol>
    <hr>

    <div id="target">대상 박스</div>

    <script>
        $(document).ready(function() {
            $('#btn1').click(function() {
                $('#target').css('background-color', 'yellow');
            });

            $('#btn2').click(function() {
                $('#target').css({
                    'background-color': 'skyblue',
                    'color': 'white'
                });
            });

            $('#btn3').click(function() {
                $('#target').css('background-color', function() {
                    return '#ffcc00';
                });
            });
        });
    </script>
</body>

</html>
