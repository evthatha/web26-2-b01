```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>

    <h1>로그인</h1>

    <form>

        <p>
            <label>아이디</label><br>
            <input type="text" name="id">
        </p>

        <p>
            <label>비밀번호</label><br>
            <input type="password" name="password">
        </p>

        <p>
            <label>파일 선택</label><br>
            <input type="file" name="file">
        </p>

        <p>
            <label>관심 분야</label><br>
            <input type="checkbox" name="interest" value="music"> 음악
            <input type="checkbox" name="interest" value="movie"> 영화
            <input type="checkbox" name="interest" value="game"> 게임
        </p>

        <p>
            <label>성별</label><br>
            <input type="radio" name="gender" value="male"> 남자
            <input type="radio" name="gender" value="female"> 여자
        </p>

        <input type="hidden" name="userNumber" value="12345">

        <p>
            <label>좋아하는 음식 선택</label><br>

            <select name="food">

                <optgroup label="한식">
                    <option>김치찌개</option>
                    <option>비빔밥</option>
                    <option>불고기</option>
                </optgroup>

                <optgroup label="중식">
                    <option>짜장면</option>
                    <option>짬뽕</option>
                    <option>탕수육</option>
                </optgroup>

                <optgroup label="양식">
                    <option>파스타</option>
                    <option>피자</option>
                    <option>스테이크</option>
                </optgroup>

            </select>
        </p>

        <p>
            <label>여러 개 선택</label><br>

            <select multiple="multiple">
                <option>김치찌개</option>
                <option>비빔밥</option>
                <option>짜장면</option>
                <option>짬뽕</option>
                <option>피자</option>
                <option>파스타</option>
            </select>
        </p>

        <p>
            <label>추가 선택항목</label><br>

            <select name="drink">
                <option>물</option>
                <option>콜라</option>
                <option>사이다</option>
                <option>주스</option>
                <option>커피</option>
            </select>
        </p>

        <p>
            <button type="submit">로그인</button>
            <button type="reset">초기화</button>
            <button type="button">일반 버튼</button>
            <button type="button">사진 버튼</button>
        </p>

    </form>

    <h2>textarea 태그 주의 사항</h2>
    <p>text area 태그 내 들여쓰기가 입력양식 내부에 출력되므로 주의</p>
    <textarea>
textarea
        textarea
        
    </textarea>
 <h3>올바른형태</h3>
        <textarea>
textareatextarea
        
    </textarea>
    
</body>
</html>
