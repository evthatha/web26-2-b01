<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>5위치 속성</title>
    <style>
 
        .box {
            width: 100px;   height: 100px;
            position: absolute;
        }

        .box:nth-of-type(1) {
            background-color: red;
            left: 10px;      top: 10px;
            z-index: 100;
        }

        .box:nth-of-type(2) {
            background-color: green;
            left: 50px;      top: 50px;
            z-index: 50;
        }

        .box:nth-of-type(3) {
            background-color: blue;
            left: 90px;    top: 90px;
            z-index: 10;
        }

       
        body > div{
            width:400px; height:100px;
            border:3px solid black;
            position:relative;
            /*overflow:hidden; .hidden: 영역을 벗어나는 부분 감춤*/
            /*overflow:scroll;  scroll: 영역을 벗어나는 부분 스크롤바 표시*/
            overflow-y:scroll; /*overflow-x와 overflow-y 속성 적용하기*/

        }
    </style>
</head>

<body>   
    <h1>Lorem ipsum dolor sit amet</h1>
    <div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <h1>Lorem ipsum dolor sit amet</h1>

    <hr>
    <h2>내용이 요소 크기를 벗어날 때 처리 방법</h2>
    <h4> hidden: 영역을 벗어나는 부분 감춤)</h4>
    <h4>scroll: 영역을 벗어나는 부분 스크롤바 표시</h4>
    <h4> overflow-x와 overflow-y 속성 적용하기</h4>

</body>

</html>
